<!DOCTYPE html>
<html lang="en">

<head>
    <title>Online Paintboard</title>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
    <meta name="description"
        content="Online Paintboard is a collaborative drawing application that allows users to create and share artwork in real-time." />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="theme-color" content="#2196f3">
    <meta property="og:site_name" content="Online Paintboard" />
    <meta property="og:title" content="Online Paintboard" />
    <meta property="og:description"
        content="Online Paintboard is a collaborative drawing application that allows users to create and share artwork in real-time." />
    <meta property="og:image"
        content="https://raw.githubusercontent.com/minirang/online-paintboard/main/client/public/images/thumbnail.png" />
    <meta property="og:image:width" content="6400" />
    <meta property="og:image:height" content="4800" />
    <meta property="og:url" content="https://online-paintboard.onrender.com" />
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Online Paintboard" />
    <meta name="twitter:description"
        content="Online Paintboard is a collaborative drawing application that allows users to create and share artwork in real-time." />
    <meta name="twitter:image"
        content="https://raw.githubusercontent.com/minirang/online-paintboard/main/client/public/images/thumbnail.png" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="manifest" href="/manifest.json">
</head>

<body>
    <header>
        <div class="logo_area">
            <a href="https://minirang.vercel.app">
                <img src="/images/logo.svg" alt="Logo" height="40" title="개발자의 웹사이트로 이동">
            </a>
            <h1 style="cursor: default;">Online Paintboard</h1>
        </div>
        <div class="control_area">
            <div class="toggle">
                <label class="switch_label" for="paintToggle" title="Switch between drawing and moving mode">
                    <input type="checkbox" id="paintToggle" class="switch_input">
                    <span class="switch_slider"></span>
                </label>
                <span class="toggle_text">그리기 모드</span>
            </div>

            <div class="slider_row">
                <input type="range" id="brushSize" min="1" max="20" value="5" title="Brush Size">
                <p>Brush Size: <span id="brushSizeValue">5</span></p>
            </div>

            <div class="color_row">
                <input type="color" id="brushColor" value="#000000" title="Brush Color">
                <p>Brush Color: <span id="brushColorValue">#000000</span></p>
            </div>
        </div>
    </header>
    <div class="canvas_container">
        <div id="loading" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3.5vw;
            font-weight: bold;
            z-index: 9999;
            cursor: wait;">
            그림 로드 중...</div>
        <canvas id="canvas"></canvas>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
